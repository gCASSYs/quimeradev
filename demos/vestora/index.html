<style>
/* CSS crítico: fontes, base e preloader (o restante vem de style.css) */
@font-face{font-family:"Inter";src:url(assets/fonts/inter-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-500.woff) format("woff");font-weight:500;font-display:swap}
@font-face{font-family:"Inter";src:url(assets/fonts/inter-600.woff) format("woff");font-weight:600 700;font-display:swap}
@font-face{font-family:"Poppins";src:url(assets/fonts/poppins-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Poppins";src:url(assets/fonts/poppins-500.woff) format("woff");font-weight:500 700;font-display:swap}
@font-face{font-family:"Lora";src:url(assets/fonts/lora-italic.woff) format("woff");font-style:italic;font-weight:400 700;font-display:swap}
html{background:#232323;color:#F5F5F5;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#232323}
.preloader{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:#141414;transition:opacity .5s cubic-bezier(.2,.7,.2,1),visibility .5s}
.preloader.done{opacity:0;visibility:hidden}
.pl-logo{width:min(300px,64vw);height:auto;overflow:visible}
.pl-logo path{stroke-dasharray:1;stroke-dashoffset:1;animation:pl-draw 1.1s cubic-bezier(.65,0,.35,1) forwards}
.pl-logo .w{fill:#F5F5F5;fill-opacity:0;stroke:#F5F5F5;stroke-width:.6;animation:pl-draw 1s cubic-bezier(.65,0,.35,1) .25s forwards,pl-fill .5s ease .95s forwards}
.pl-logo .m{animation-duration:1.2s}
.pl-logo circle{opacity:0;animation:pl-fill .4s ease 1s forwards}
.pl-meta{position:absolute;left:0;right:0;bottom:28px;padding:0 28px;display:flex;justify-content:space-between;font:500 13px/1 "Inter",system-ui,sans-serif;color:#929292;font-variant-numeric:tabular-nums}
.pl-pct{color:#F5F5F5}
.pl-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#232323}
.pl-bar span{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#08E5C1,#9B70FF)}
@keyframes pl-draw{to{stroke-dashoffset:0}}
@keyframes pl-fill{to{fill-opacity:1;opacity:1}}
@media (prefers-reduced-motion:reduce){.pl-logo path,.pl-logo circle{animation:none;stroke-dashoffset:0;fill-opacity:1;opacity:1}}
.app{opacity:0}
.app.ready{opacity:1;transition:opacity .4s ease}
</style>
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
